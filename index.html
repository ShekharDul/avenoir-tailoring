<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Avenoir Tailoring — premium tailoring shaped around your personal aesthetic."
    />
    <title>Avenoir Tailoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alata&family=Cardo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Avenoir Tailoring home">
          Avenoir Tailoring
        </a>

        <nav class="primary-nav" aria-label="Primary navigation">
          <a href="#new-arrivals">New arrivals</a>
          <a href="#customize">Customize</a>
          <a href="#who-we-are">Who we are</a>
        </nav>

        <nav class="utility-nav" aria-label="Account and shopping">
          <button type="button">My account</button>
          <button type="button">Cart <span aria-label="0 items">(0)</span></button>
        </nav>
      </header>

      <div class="hero-copy">
        <h1>An expression<br />that fits only you</h1>
      </div>

      <div class="hero-shade" aria-hidden="true"></div>
    </main>

    <section class="categories" id="new-arrivals" aria-label="Product categories">
      <div class="category-images">
        <figure class="category-image">
          <img
            src="image_assets/section2_1.jpg"
            alt="Man wearing a tailored camel overcoat"
            loading="lazy"
          />
          <figcaption>Refined Outerwear</figcaption>
        </figure>
        <figure class="category-image">
          <img
            src="image_assets/section2_2.jpg"
            alt="Man seated in a tailored evening suit"
            loading="lazy"
          />
          <figcaption>Evening Tailoring</figcaption>
        </figure>
      </div>
      <a class="services-button" href="#customize">
        <svg viewBox="0 0 48 26" aria-hidden="true">
          <path d="M24 10V7.5a4 4 0 1 0-4-4" />
          <path d="M24 10 43 22H5L24 10Z" />
        </svg>
        <span>Explore services</span>
      </a>
    </section>
  </body>
</html>
